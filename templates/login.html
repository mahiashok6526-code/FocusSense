<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FocusSense</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="ambient-mesh">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>

    <!-- Hidden flash messages for automatic toast rendering -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash-data-msg" data-category="{{ category }}" data-message="{{ message }}" style="display:none;"></div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div class="auth-wrapper">
        <div class="glass-card auth-card">
            <div class="card-highlight-glow"></div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <a href="/" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
                    <div class="brand-icon" style="width: 34px; height: 34px; font-size: 16px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M12 3v3m0 12v3M3 12h3m12 0h3"></path>
                            <circle cx="12" cy="12" r="2" fill="currentColor"></circle>
                        </svg>
                    </div>
                    <span class="brand-text" style="font-size: 18px;">FocusSense</span>
                </a>

                <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme" aria-label="Toggle Theme" style="width: 36px; height: 36px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>

            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Sign in to sync your radar presence & study analytics.</p>
            </div>

            <form method="POST" action="/login" class="auth-form">
                <div>
                    <label style="font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; color: var(--text-secondary);">Username</label>
                    <input type="text" name="username" class="modern-input" placeholder="Enter your username" required autocomplete="username">
                </div>

                <div>
                    <label style="font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; color: var(--text-secondary);">Password</label>
                    <input type="password" name="password" class="modern-input" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-primary-block">
                    Sign In to Dashboard
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register">Create an account</a>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
